name: CI

# Real, executing GitHub Actions pipeline: lint -> test -> retrain/validate
# a model on every push. This is the automation this repo is claiming a
# time-to-production win for -- it must actually run, not just exist.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools
        run: pip install ruff
      - name: Lint
        run: ruff check . --line-length 110

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q

  train-and-validate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Retrain all 5 models against the feature store and validate
        run: python run_all.py
      - name: Enforce minimum model quality gate (roc_auc >= 0.65 for every model)
        run: |
          python - <<'EOF'
          import json, sys
          summary = json.load(open("run_summary.json"))
          assert summary["point_in_time_check_passed"], "feature store point-in-time check failed"
          failed = [m for m in summary["models"] if m["roc_auc"] < 0.65]
          if failed:
              print("Models below quality gate:", failed)
              sys.exit(1)
          print(f"All {len(summary['models'])} models passed the quality gate.")
          for m in summary["models"]:
              print(f"  {m['model_name']:28s} roc_auc={m['roc_auc']:.3f}")
          EOF
      - name: Upload run summary
        uses: actions/upload-artifact@v4
        with:
          name: run-summary
          path: run_summary.json
